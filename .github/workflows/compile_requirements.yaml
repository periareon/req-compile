# Compile a `py_reqs_compiler` target with `--upgrade` and publish the resulting
# changes as a patch. Solutions for every platform can be compiled from Linux.

name: compile_requirements

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'The py_reqs_compiler target to run'
        required: true

jobs:
  compile:
    name: Compile requirements
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile requirements
      run: |
        bazel run "${{ github.event.inputs.target }}" "--" "--upgrade" "--verbose"
    - name: Show changes
      run: |
        git --no-pager diff
        git diff > requirements.patch
    - name: Upload changes
      uses: actions/upload-artifact@v4
      with:
        name: requirements.patch
        path: requirements.patch
