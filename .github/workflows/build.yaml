---
# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [ main ]
  merge_group:
  pull_request:
    branches: [ main ]


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python_version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.platform }}
    name: test ${{ matrix.platform }} (py${{ matrix.python_version }})

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v2
      with:
        python-version: "${{ matrix.python_version }}"
    - name: Setup pip
      run: |
        python -m pip install --upgrade pip setuptools
    - name: Install dependencies
      run: |
        pip install -r 3rdparty/requirements.txt --user
    - name: Run mypy
      run: |
        python -m mypy req_compile
    - name: Run pylint
      run: |
        python -m pylint req_compile tests
    - name: Test with pytest
      run: |
        python -m pytest -v --ignore=private

  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r 3rdparty/requirements.txt --user
    - name: Run black
      run: |
        black --check --diff req_compile
    - name: Run isort
      run: |
        isort --check-only req_compile

  bazel-bzlmod:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-14", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    name: bazel test --build ${{ matrix.platform }} (bzlmod)
    steps:
    - uses: actions/checkout@v2
    - name: Configure Build Event Service
      run: |
        echo "common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > "${CI_BAZELRC_PATH}"
        echo "common --config=bes" >> "${CI_BAZELRC_PATH}"
        echo "common --announce_rc" >> "${CI_BAZELRC_PATH}"
      env:
        CI_BAZELRC_PATH: .github/ci.bazelrc
    - name: Run Tests
      run: |
        bazel test //...
    - name: Cross-compile requirements for every platform
      shell: pwsh
      run: |
        foreach ($platform in @("linux_aarch64", "linux_x86_64", "macos_aarch64", "macos_x86_64", "windows_x86_64")) {
          bazel run "//3rdparty:requirements_${platform}_311" "--" "--upgrade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    - name: Upload cross-compiled requirements
      uses: actions/upload-artifact@v4
      with:
        name: requirements-${{ matrix.platform }}
        path: 3rdparty/requirements.*.txt
        if-no-files-found: error

  bazel-cross-platform-consistency:
    needs: bazel-bzlmod
    runs-on: ubuntu-latest
    name: cross-compiled requirements agree on every host
    steps:
    - name: Download cross-compiled requirements
      uses: actions/download-artifact@v4
      with:
        pattern: requirements-*
        path: artifacts
    - name: Compare the solutions compiled on each host
      run: |
        set -euo pipefail
        reference="artifacts/requirements-ubuntu-latest"
        status=0
        for dir in artifacts/requirements-*; do
          if [[ "${dir}" == "${reference}" ]]; then
            continue
          fi
          if ! diff -r "${reference}" "${dir}"; then
            echo "::error::Requirements compiled on $(basename "${dir}") differ from those compiled on $(basename "${reference}")"
            status=1
          fi
        done
        exit "${status}"

  bazel_users:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-14", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    name: bazel test multiplatform_py_test --build ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v2
    - name: Test user repo examples
      run: |
        bazel test //...
      working-directory: private/examples/multiplatform_py_test
    - name: Test module repo overrides
      run: |
        bazel test //...
      working-directory: private/tests/override_module_repos/overrider

  bazel_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v2
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r 3rdparty/requirements.txt --user
        pip install -e .
    - name: Run isort
      run: |
        isort --check-only private
    - name: Run black
      run: |
        black --check --diff private
    - name: Run pylint
      run: |
        python -m pylint private
    - name: Run buildifier
      run: bazel run //:buildifier.check
