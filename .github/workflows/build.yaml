---
name: Build

on:
  push:
    branches: [ main ]
  merge_group:
  pull_request:
    branches: [ main ]

env:
  # Startup option applied to every Bazel invocation. See the file for details.
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

jobs:
  # Bazel pins a single interpreter, so this matrix is the only coverage of
  # `req-compile` running on the other Python versions it claims to support.
  # Linting, type checking and the Bazel rules are all handled by `bazel-bzlmod`.
  build:
    strategy:
      fail-fast: false
      matrix:
        # `macos-15` rather than `macos-latest`, which is the newest image
        # (macOS 26) and lost runners mid-job three times in two days, cancelled
        # with no log after 15 to 30 minutes; and rather than `macos-14`, which
        # retires on 2 November 2026 with brownouts before. The timeout makes a
        # lost runner fail within minutes instead of holding the run.
        platform: ["ubuntu-latest", "macos-15", "windows-latest"]
        python_version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    name: test ${{ matrix.platform }} (py${{ matrix.python_version }})

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v2
      with:
        python-version: "${{ matrix.python_version }}"
    - name: Setup pip
      run: |
        python -m pip install --upgrade pip setuptools
    - name: Install dependencies
      run: |
        pip install -r 3rdparty/requirements.txt --user
    - name: Test with pytest
      run: |
        python -m pytest -v --ignore=examples tests

  bazel-bzlmod:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-15", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    name: bazel test --build ${{ matrix.platform }} (bzlmod)
    steps:
    - uses: actions/checkout@v2
    - name: Configure Build Event Service
      # Written the same way from bash and PowerShell.
      run: |
        echo "common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > "${{ env.CI_BAZELRC_PATH }}"
        echo "common --config=bes" >> "${{ env.CI_BAZELRC_PATH }}"
      env:
        CI_BAZELRC_PATH: .github/ci.bazelrc
    - name: Run Tests
      run: |
        bazel ${{ env.BAZEL_STARTUP_FLAGS }} test --config=strict //...
    - name: Cross-compile requirements for every platform
      run: |
        bazel ${{ env.BAZEL_STARTUP_FLAGS }} run "//3rdparty:requirements.update" "--" "--upgrade"
    - name: Upload cross-compiled requirements
      uses: actions/upload-artifact@v4
      with:
        name: requirements-${{ matrix.platform }}
        path: 3rdparty/requirements.*.txt
        if-no-files-found: error

  bazel-cross-platform-consistency:
    needs: bazel-bzlmod
    runs-on: ubuntu-latest
    name: cross-compiled requirements agree on every host
    steps:
    - name: Download cross-compiled requirements
      uses: actions/download-artifact@v4
      with:
        pattern: requirements-*
        path: artifacts
    - name: Compare the solutions compiled on each host
      run: |
        set -euo pipefail
        reference="artifacts/requirements-ubuntu-latest"
        status=0
        for dir in artifacts/requirements-*; do
          if [[ "${dir}" == "${reference}" ]]; then
            continue
          fi
          if ! diff -r "${reference}" "${dir}"; then
            echo "::error::Requirements compiled on $(basename "${dir}") differ from those compiled on $(basename "${reference}")"
            status=1
          fi
        done
        exit "${status}"

  bazel_users:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-15", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    name: bazel test examples ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v2
    # Modules that only exist to be depended on by another example are skipped.
    # `overridee` deliberately ships an incomplete solution that only resolves
    # once `overrider` replaces its repositories, and the `shared_hubs`
    # `constraints` and `lib` modules are exercised by `app`. Bazel's
    # convenience symlinks point back at a module that was already visited.
    - name: Test example modules
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        for module in examples/*/MODULE.bazel examples/*/*/MODULE.bazel; do
          dir="$(dirname "${module}")"
          case "${dir}" in
            */bazel-*) continue ;;
            examples/override_module_repos/overridee) continue ;;
            examples/shared_hubs/constraints | examples/shared_hubs/lib) continue ;;
          esac

          echo "::group::${dir}"
          (cd "${dir}" && bazel ${{ env.BAZEL_STARTUP_FLAGS }} test //...)
          echo "::endgroup::"
        done
    - name: Test example modules
      if: runner.os == 'Windows'
      # Bazel is launched from the native shell on Windows, not Git bash.
      shell: pwsh
      run: |
        $skip = @(
          "examples/override_module_repos/overridee",
          "examples/shared_hubs/constraints",
          "examples/shared_hubs/lib"
        )

        $root = (Get-Location).Path
        $modules = Get-ChildItem -Path examples -Recurse -Depth 2 -File -Filter MODULE.bazel | Sort-Object FullName
        foreach ($module in $modules) {
          $dir = $module.DirectoryName.Substring($root.Length + 1) -replace "\\", "/"
          if ($dir -match "(^|/)bazel-") { continue }
          if ($skip -contains $dir) { continue }

          Write-Output "::group::$dir"
          Push-Location $dir
          try {
            bazel ${{ env.BAZEL_STARTUP_FLAGS }} test //...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
            Write-Output "::endgroup::"
          }
        }

  bazel_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Run buildifier
      run: bazel ${{ env.BAZEL_STARTUP_FLAGS }} run //:buildifier.check

  # The WebAssembly solver, built the way the release builds it (rules_venv's
  # `py_wasm_module`, which has toolchains for Linux and macOS) and exercised
  # both under wasmtime and the way Bazel runs it, through the example
  # workspace.
  wasm_solver:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-15"]
    runs-on: ${{ matrix.platform }}
    name: wasm solver ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v2
    - name: Build the solver module
      run: |
        bazel ${{ env.BAZEL_STARTUP_FLAGS }} build //wasm:req_compile_solver
        cp "$(bazel ${{ env.BAZEL_STARTUP_FLAGS }} cquery --output=files //wasm:req_compile_solver)" "${RUNNER_TEMP}/req_compile_solver.wasm"
        chmod 0644 "${RUNNER_TEMP}/req_compile_solver.wasm"
    - name: Run the module under wasmtime
      run: |
        python3 -m venv "${RUNNER_TEMP}/venv"
        "${RUNNER_TEMP}/venv/bin/python" -m pip install --quiet wasmtime certifi
        echo '{"op": "ping"}' | "${RUNNER_TEMP}/venv/bin/python" wasm/run_local.py "${RUNNER_TEMP}/req_compile_solver.wasm"
        "${RUNNER_TEMP}/venv/bin/python" wasm/drive_local.py "${RUNNER_TEMP}/req_compile_solver.wasm" wasm/example/requirements.in \
          --platform manylinux_2_28_x86_64 --platform macosx_11_0_arm64
    - name: Resolve the example workspace with Bazel
      env:
        # `execute_wasm` compiles the module to JVM bytecode from Bazel 10.
        USE_BAZEL_VERSION: 10.0.0rc1
      run: |
        cp "${RUNNER_TEMP}/req_compile_solver.wasm" wasm/example/
        cd wasm/example && bazel ${{ env.BAZEL_STARTUP_FLAGS }} build //...
    - name: Upload the module
      uses: actions/upload-artifact@v4
      with:
        name: req_compile_solver-${{ matrix.platform }}
        path: ${{ runner.temp }}/req_compile_solver.wasm
        if-no-files-found: error

  # A single job to mark as required for merging. It runs regardless of the
  # outcome of the others and only succeeds when every one of them did, so a
  # job that is added above must also be added to `needs` here.
  ci-success:
    name: CI Success
    if: always()
    needs:
      - build
      - bazel-bzlmod
      - bazel-cross-platform-consistency
      - bazel_users
      - bazel_lint
      - wasm_solver
    runs-on: ubuntu-latest
    steps:
    - name: Check the result of every job
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: ${RESULTS}"
        for result in ${RESULTS}; do
          if [[ "${result}" != "success" ]]; then
            echo "::error::A required job did not succeed (${result})."
            exit 1
          fi
        done
