---
# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [ main ]
  merge_group:
  pull_request:
    branches: [ main ]


jobs:
  # Bazel pins a single interpreter, so this matrix is the only coverage of
  # `req-compile` running on the other Python versions it claims to support.
  # Linting, type checking and the Bazel rules are all handled by `bazel-bzlmod`.
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python_version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.platform }}
    name: test ${{ matrix.platform }} (py${{ matrix.python_version }})

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v2
      with:
        python-version: "${{ matrix.python_version }}"
    - name: Setup pip
      run: |
        python -m pip install --upgrade pip setuptools
    - name: Install dependencies
      run: |
        pip install -r 3rdparty/requirements.txt --user
    - name: Test with pytest
      run: |
        python -m pytest -v tests

  bazel-bzlmod:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-14", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    name: bazel test --build ${{ matrix.platform }} (bzlmod)
    steps:
    - uses: actions/checkout@v2
    - name: Configure Build Event Service
      run: |
        echo "common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > "${CI_BAZELRC_PATH}"
        echo "common --config=bes" >> "${CI_BAZELRC_PATH}"
        echo "common --announce_rc" >> "${CI_BAZELRC_PATH}"
      env:
        CI_BAZELRC_PATH: .github/ci.bazelrc
    - name: Run Tests
      run: |
        bazel test --config=strict //...
    - name: Perform compilation
      run: |
        bazel run //3rdparty:requirements_compiler "--" --upgrade

  bazel_users:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-14", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    name: bazel test examples ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v2
    - name: Test example modules
      shell: bash
      run: |
        set -euo pipefail
        for module in examples/*/MODULE.bazel examples/*/*/MODULE.bazel; do
          dir="$(dirname "${module}")"

          # Bazel's convenience symlinks point back at a module that was
          # already visited.
          if [[ "$(basename "${dir}")" == bazel-* ]]; then
            continue
          fi

          # `overridee` deliberately ships an incomplete solution. It only
          # resolves when `overrider` replaces its repositories, so it is
          # covered by building that module rather than on its own.
          if [[ "${dir}" == "examples/override_module_repos/overridee" ]]; then
            continue
          fi

          echo "::group::${dir}"
          (cd "${dir}" && bazel test //...)
          echo "::endgroup::"
        done

  bazel_lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Run buildifier
      run: bazel run //:buildifier.check
