# After Dependabot edits requirements.txt, MODULE.bazel.lock no longer matches
# its recorded inputs and `--lockfile_mode=error` would fail. This job resolves
# the hub again with the WebAssembly solver and commits the updated lock to the
# pull request branch, so the PR is complete and CI can keep `error` mode.
name: Refresh MODULE.bazel.lock

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements.in"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Dependabot's token cannot trigger further workflows; a PAT or app token can.
          token: ${{ secrets.LOCK_REFRESH_TOKEN }}

      # A released `rules_req_compile` downloads its own solver module; nothing
      # to fetch here. (This example tracks the source checkout instead and
      # names a locally built module with `solver`.)

      - name: Resolve and update the lock
        env:
          USE_BAZEL_VERSION: "10.0.0"
        run: |
          bazel mod deps --lockfile_mode=update \
            --experimental_repository_ctx_execute_wasm \
            --experimental_repository_ctx_wasm_compilation

      - name: Commit the lock
        run: |
          git config user.name "dependabot-lock-refresh"
          git config user.email "dependabot-lock-refresh@users.noreply.github.com"
          git add MODULE.bazel.lock
          git diff --cached --quiet || git commit -m "Refresh MODULE.bazel.lock for the dependency update"
          git push
