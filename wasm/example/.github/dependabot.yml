# Dependabot keeps requirements.txt current. The `pip` ecosystem understands the
# pinned format, versions and hashes included; the hub takes a bumped version and
# its hashes as given when it resolves, and `requirements.update` rewrites the
# file in its own format afterwards.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per batch keeps the number of lock refreshes down.
    groups:
      python:
        patterns: ["*"]
